<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <!-- Meta Tags -->
    <title>Floriatan Santos Costa - Portfólio</title>
    <meta name="description"
        content="Portfólio acadêmico e profissional de Floriatan Santos Costa. Explore projetos, publicações e experiências.">
    <meta property="og:title" content="Floriatan Santos Costa - Portfólio">
    <meta property="og:description"
        content="Portfólio acadêmico e profissional. Explore projetos, publicações e experiências.">
    <meta property="og:image" content="./assets/img/cover.png">
    <meta name="theme-color" content="#5a729e">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://floriatan.com.br/">

    <!-- Previne o piscar branco -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- css -->
    <link rel="stylesheet" href="./components/style.css">
    <link rel="stylesheet" href="../web/css/style.css">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <!-- Cabeçalho e Navegação -->
    <header>
        <div class="container header-content">
            <a href="/">
                <img src="../assets/logo.svg" alt="Logo" class="logo-img">
            </a>
            <h1 class="site-title">Gerador automático de assinaturas</h1>
            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema"
                    style="padding: 0;"><img src="./assets/icons/escuro.svg" alt="Ativar Modo Escuro"
                        style="width: 20px; height: 20px;"></button>
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            </div>
        </div>
    </header>
    <nav>
        <div class="container nav-content" id="navMenu">
            <a href="/web/">Início</a>
            <a href="/web/gerador">E-mail</a>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main>
        <div class="container">
            <!-- Formulário -->
            <div class="form-section">
                <h2>Dados da Assinatura</h2>
                <div class="form-group">
                    <label for="select-logo">Logo da Instituição</label>
                    <select id="select-logo">
                        <option value="/components/gerador/logo-1.png">Logo 1 - UFPR</option>
                        <option value="/components/gerador/logo-2.png">Logo 2 - UFPR/Química</option>
                        <option value="/components/gerador/logo-3.png">Logo 3 - UFPR/LAESB</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input-nome">Nome</label>
                    <input type="text" id="input-nome" value="Nome">
                </div>
    
                <div class="form-group">
                    <label for="input-cargo">Cargo ou título</label>
                    <input type="text" id="input-cargo" value="Cargo ou Função">
                </div>
    
                <div class="form-group">
                    <label for="input-lab1">Laboratório</label>
                    <input type="text" id="input-lab1" value="Laboratorio">
                </div>
    
                <div class="form-group">
                    <label for="input-inst1">Instituição</label>
                    <input type="text" id="input-inst1" value="Universidade Federal do Paraná">
                </div>
    
                <div class="form-group">
                    <label for="input-lab2">Laboratório (se houver)</label>
                    <input type="text" id="input-lab2" value="Laboratório (se houver)">
                    <div class="tip">Apague para ocultar</div>
                </div>
    
                <div class="form-group">
                    <label for="input-inst2">Instituição (se houver)</label>
                    <input type="text" id="input-inst2" value="Instituição (se houver)">
                    <div class="tip">Apague para ocultar</div>
                </div>
    
                <div class="form-group">
                    <label for="input-url-web">Site pessoal</label>
                    <input type="text" id="input-url-web" value="Link aqui">
                    <div class="tip">Apague para ocultar</div>
                </div>
    
                <div class="form-group">
                    <label for="input-url-lattes">Currículo Lattes</label>
                    <input type="text" id="input-url-lattes" value="http://lattes.cnpq.br/XXXXXXXXXXXX">
                    <div class="tip">Apague para ocultar</div>
                </div>
    
                <div class="form-group">
                    <label for="input-url-orcid">Link do OrcID</label>
                    <input type="text" id="input-url-orcid" value="https://orcid.org/XXXX-XXXX-XXXX-XXXX">
                    <div class="tip">Apague para ocultar</div>
                </div>
            </div>
            <!-- Visualização e Ação de Copiar -->
            <div class="preview-section">
                <h2>Visualização (real time)</h2>
                <div class="preview-box" id="preview-container">
                </div>
                <button class="btn-copy" onclick="copiarAssinatura()">Copiar assinatura</button>
                <div class="alert" id="success-alert">CONTEÚDO COPIADO COM SUCESSO!</div>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; <span id="year"></span> Floriatan Santos Costa — Todos os direitos reservados.</p>
            </div>
            <div class="footer-right">
            </div>
        </div>
    </footer>

    <!-- Scripts -->

    <script src="./js/menu.js"></script>
    <script src="./components/gerador/app.js"></script>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>

</html>
