<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Meta Tags Básicas -->
    <title>Floriatan Santos Costa - Portfolio</title>
    <meta name="description"
        content="Portfólio acadêmico e profissional de Floriatan Santos Costa. Explore projetos, publicações e experiências.">
    <meta name="theme-color" content="#5a729e">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Floriatan Santos Costa - Portfolio">
    <meta property="og:description"
        content="Portfólio acadêmico e profissional de Floriatan Santos Costa. Explore projetos, publicações e experiências.">
    <meta property="og:image" content="./assets/img/cover.png">
    <meta property="og:url" content="https://floriatanscosta.github.io/">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/main.css">
    <!-- Previne piscar -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>

<body>
    <!-- header e nav js -->
    <div id="header-placeholder"></div>
    <!-- Conteúdo principal -->
    <main>
        <div class="container">
            <!-- ATUALIZAÇÃO DE CONTEÚDO NESTA ÁREA PRINCIPAL -->
            <!-- Widget de Métricas -->
            <section class="col-1">
                <h2>Métricas de Produção Científica</h2>
                <p>Scientific production metrics.</p>

                <!-- Scopus -->
                <h3>Scopus® - Elsevier</h3>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Articles</span>
                        <span class="metric-number metric-color-1">41</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Citations</span>
                        <span class="metric-number metric-color-2">389</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">H-index</span>
                        <span class="metric-number metric-color-3">14</span>
                    </div>
                </div>

                <!-- Web of Science -->
                <h3>Web of Science™ - Clarivate</h3>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Articles</span>
                        <span class="metric-number metric-color-1">45</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Citations</span>
                        <span class="metric-number metric-color-2">340</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">H-index</span>
                        <span class="metric-number metric-color-3">13</span>
                    </div>
                </div>

                <!-- Informações de Atualização e Fontes -->
                <div class="metrics-sources">
                    <b>Updated:</b> 18/07/2026<br>
                    <b>Source:</b> <a href="https://www.scopus.com/authid/detail.uri?authorId=57216746115"
                        target="_blank" class="inline-link">Scopus®</a> (Elsevier B.V.)<br>
                    <b>Source:</b> <a href="https://www.webofscience.com/wos/author/record/S-1383-2018" target="_blank"
                        class="inline-link">Web of Science™</a> (Clarivate B.V.)
                </div>
            </section>

            <!-- ATUALIZAÇÃO DE CONTEÚDO NESTA ÁREA PRINCIPAL -->
        </div>
    </main>

    <!-- footer -->
    <div id="footer-placeholder"></div>
    <!-- scripts -->
    <script src="./js/load-components.js"></script>
    <script src="./js/menu.js"></script>
</body>

</html>
