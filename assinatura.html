<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <!-- Meta Tags -->
    <title>Assinatura E-mail design - Floriatan Santos Costa</title>
    <meta name="description" content="Gerador de assinaturas de e-mail institucionais.">
    <meta property="og:title" content="Assinatura E-mail design - Floriatan Santos Costa">
    <meta property="og:description" content="Configure e gere a sua assinatura de e-mail institucional.">
    <meta property="og:image" content="./assets/img/cover.png">
    <meta name="theme-color" content="#5a729e">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://floriatan.com.br/web/assinatura">
    <meta name="robots" content="noindex, nofollow">

    <!-- Previne o piscar branco -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- css -->
    <link rel="stylesheet" href="./components/style.css">
    <link rel="stylesheet" href="../web/css/style.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Header e nav -->
    <header>
        <div class="container header-content">
            <!-- Logo e nome -->
            <div class="header-left">
                <a href="/en/" class="logo-link">
                    <img src="/assets/logo.svg" alt="Logo Floriatan" class="logo-img">
                </a>
                <h1 class="site-title">Assinatura E-mail design</h1>
            </div>
            <!--  Menu -->
            <nav id="navMenu" class="nav-content">
            </nav>
            <!-- Idioma e tema -->
            <div class="header-right">
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema" style="padding: 0;"><img src="/assets/icons/escuro.svg" alt="Ativar Modo Escuro" style="width: 20px; height: 20px;"></button>
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            
            <div class="app-container">
                <div class="form-panel">
                    <h3>Dados da assinatura</h3>
                    <form id="assinaturaForm" class="form-grid">
                        <div class="form-group full-width">
                            <label for="select-logo">Logo</label>
                            <select id="select-logo">
                                <option value="./components/gerador/logo-1.png">Logo 1 - UFPR</option>
                                <option value="./components/gerador/logo-2.png">Logo 2 - UFPR e Dep. Química</option>
                                <option value="./components/gerador/logo-3.png">Logo 3 - UFPR e LAESB</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label for="input-nome">Nome</label>
                            <input type="text" id="input-nome" value="Nome">
                        </div>
        
                        <div class="form-group full-width">
                            <label for="input-cargo">Cargo ou título</label>
                            <input type="text" id="input-cargo" value="Cargo ou Função">
                        </div>
                        
                        <div class="form-group">
                            <label for="input-lab1">Laboratório</label>
                            <input type="text" id="input-lab1" value="Laboratorio">
                        </div>

                        <div class="form-group">
                            <label for="input-inst1">Instituição</label>
                            <input type="text" id="input-inst1" value="Universidade Federal do Paraná">
                        </div>
        
                        <div class="form-group">
                            <label for="input-lab2">Laboratório (se houver) <span class="custom-tooltip" data-tooltip="Apague o conteúdo para ocultar este campo na assinatura.">ⓘ</span></label>
                            <input type="text" id="input-lab2" value="Laboratório (se houver)">
                        </div>
        
                        <div class="form-group">
                            <label for="input-inst2">Instituição (se houver) <span class="custom-tooltip" data-tooltip="Apague o conteúdo para ocultar este campo na assinatura.">ⓘ</span></label>
                            <input type="text" id="input-inst2" value="Instituição (se houver)">
                        </div>
        
                        <div class="form-group full-width">
                            <label for="input-url-web">Site pessoal <span class="custom-tooltip" data-tooltip="Apague o conteúdo para ocultar este campo na assinatura.">ⓘ</span></label>
                            <input type="text" id="input-url-web" value="Link aqui">
                        </div>
        
                        <div class="form-group">
                            <label for="input-url-lattes">Currículo Lattes <span class="custom-tooltip" data-tooltip="Apague o conteúdo para ocultar este campo na assinatura.">ⓘ</span></label>
                            <input type="text" id="input-url-lattes" value="http://lattes.cnpq.br/XXXXXXXXXXXX">
                        </div>
        
                        <div class="form-group">
                            <label for="input-url-orcid">Link do OrcID <span class="custom-tooltip" data-tooltip="Apague o conteúdo para ocultar este campo na assinatura.">ⓘ</span></label>
                            <input type="text" id="input-url-orcid" value="https://orcid.org/XXXX-XXXX-XXXX-XXXX">
                        </div>
                    </form>
                </div>

                <!-- preview -->
                <div class="preview-panel">
                    <div class="card">
                        <h3>Preview</h3>
                        <div class="preview-box" id="preview-container" style="padding: 20px; background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin-bottom: 20px;"><!-- O conteúdo da assinatura será injetado aqui pelo JS --></div>
                        <div class="btn-group">
                            <button id="copyBtn" class="btn btn-copy" onclick="copiarAssinatura()">Copiar assinatura</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Global -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle" class="modal-title">Sucesso!</h3>
            <p id="modalMessage" class="modal-message">A assinatura foi copiada.</p>
            <button class="btn" style="width: 100%;" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- Rodapé -->
    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; <span id="year"></span> Floriatan Santos Costa — All rights reserved</p>
            </div>
            <div class="footer-right">
                <a href="/">Perfil</a>
                <a href="/web/sobre">Sobre</a>
                <a href="/web/contato">Contato</a>
            </div>
        </div>
    </footer>
    
    <!-- Scripts -->
    <script src="./js/app.js"></script>
    <script src="./components/gerador/app.js"></script>
</body>

</html>
