<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <!-- Meta Tags -->
    <title>HPDDPlate XML Generator - Floriatan Santos Costa</title>
    <meta name="description" content="Web tool for configuring micro-dispensing plate parameters and generating XML code for HPDDPlate matrices.">
    <meta property="og:title" content="HPDDPlate XML Generator">
    <meta property="og:description" content="Configure plate parameters, preview grid layouts in real-time, and generate safe XML code for micro-dispensing applications.">
    <meta property="og:image" content="https://floriatan.com.br/web/components/custom-plate/cover.png">
    <meta name="theme-color" content="#5a729e">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://floriatan.com.br/web/custom-plate">

    <!-- js -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- css -->
    <link rel="stylesheet" href="./components/style.css">
    <link rel="stylesheet" href="../web/css/style.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Header e nav -->
    <header>
        <div class="container header-content">
            <!-- Logo e nome -->
            <div class="header-left">
                <a href="/en/" class="logo-link">
                    <img src="/assets/logo.svg" alt="Logo Floriatan" class="logo-img">
                </a>
                <h1 class="site-title">Floriatan Costa</h1>
            </div>
            <!--  Menu -->
            <nav id="navMenu" class="nav-content">
                
            </nav>

            <!-- Idioma e tema -->
            <div class="header-right">
                <div class="lang-dropdown">
                    <button class="lang-dropbtn">EN</button>
                    <div class="lang-dropdown-content">
                        <button onclick="switchLanguage('en')">English (EN)</button>
                    </div>
                </div>
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema"
                    style="padding: 0;"><img src="/assets/icons/escuro.svg" alt="Ativar Modo Escuro"
                        style="width: 20px; height: 20px;"></button>
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <h2>Custom plate design</h2>
            <div class="app-container">
                <div class="form-panel">
                    <h3>Parameters</h3>
                    <form id="plateForm" class="form-grid">
                        <div class="form-group full-width">
                            <label for="plateId">ID / Name <span class="custom-tooltip" data-tooltip="Unique identifier and name for the plate.">ⓘ</span></label>
                            <input type="text" id="plateId" value="1A_240" required>
                        </div>
                        <div class="form-group">
                            <label for="rows">Rows <span class="custom-tooltip" data-tooltip="Number of rows in the microplate matrix.">ⓘ</span></label>
                            <input type="number" id="rows" value="20" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="cols">Cols <span class="custom-tooltip" data-tooltip="Number of columns in the microplate matrix.">ⓘ</span></label>
                            <input type="number" id="cols" value="12" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="rowpitch">Row pitch (mm) <span class="custom-tooltip" data-tooltip="Distance (in mm) between the centers of adjacent rows.">ⓘ</span></label>
                            <input type="number" id="rowpitch" value="2" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label for="colpitch">Col pitch (mm) <span class="custom-tooltip" data-tooltip="Distance (in mm) between the centers of adjacent columns.">ⓘ</span></label>
                            <input type="number" id="colpitch" value="2" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label for="a1offsetx">A1 Offset X (mm) <span class="custom-tooltip" data-tooltip="X-axis coordinate offset for the first position (A1).">ⓘ</span></label>
                            <input type="number" id="a1offsetx" value="-1.35" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="a1offsety">A1 Offset Y (mm) <span class="custom-tooltip" data-tooltip="Y-axis coordinate offset for the first position (A1).">ⓘ</span></label>
                            <input type="number" id="a1offsety" value="8" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="defaultassayvolume">Default volume <span class="custom-tooltip" data-tooltip="Default dispensing volume per well/spot.">ⓘ</span></label>
                            <input type="number" id="defaultassayvolume" value="0" step="any" required>
                        </div>
                        <div class="form-group">
                            <label for="shaketype">Shake type <span class="custom-tooltip" data-tooltip="Type of shaking required for the plate.">ⓘ</span></label>
                            <select id="shaketype">
                                <option value="Never" selected>Never</option>
                                <option value="Small">Small</option>
                                <option value="Large">Large</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="shakedefault">Shake default <span class="custom-tooltip" data-tooltip="Sets whether shaking is enabled by default.">ⓘ</span></label>
                            <select id="shakedefault">
                                <option value="False" selected>False</option>
                                <option value="True">True</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="moveaccel">Move acceleration <span class="custom-tooltip" data-tooltip="Acceleration speed for robotic movements.">ⓘ</span></label>
                            <select id="moveaccel">
                                <option value="Slow" selected>Slow</option>
                                <option value="Fast">Fast</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="customa1">Custom A1 <span class="custom-tooltip" data-tooltip="Determines if a custom offset is used for A1.">ⓘ</span></label>
                            <select id="customa1">
                                <option value="False" selected>False</option>
                                <option value="True">True</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="nozzlemask">Nozzle mask <span class="custom-tooltip" data-tooltip="Active nozzle configuration during dispensing.">ⓘ</span></label>
                            <select id="nozzlemask">
                                <option value="One">One</option>
                                <option value="Small" selected>Small</option>
                                <option value="Large">Large</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="horizontaloffset">Horizontal offset <span class="custom-tooltip" data-tooltip="Global horizontal offset applied to the plate.">ⓘ</span></label>
                            <input type="number" id="horizontaloffset" value="0" step="0.01" required>
                        </div>

                        <div class="form-group full-width" style="padding-top: 15px; margin-top: 5px;">
                            <label for="dropletsize">Preview droplet size <span class="custom-tooltip" data-tooltip="Change the visual droplet size for the grid preview (does not affect XML).">ⓘ</span></label>
                            <select id="dropletsize">
                                <option value="small">Small</option>
                                <option value="medium" selected>Medium</option>
                                <option value="large">Large</option>
                            </select>
                        </div>
                    </form>
                </div>
                
                <!-- preview -->
                <div class="preview-panel">
                    <div class="card">
                        <h3>Preview</h3>
                        <h4 id="displayPlateId" class="plate-id-display">Plate ID: <span id="idText">1A_240</span> | Total Droplets:
                            <span id="displayTotalDroplets" style="color: #1283af;">240</span>
                        </h4>
                        <div id="gridWarning" class="grid-warning"
                            style="display: none; color: #d9534f; font-weight: bold; margin-bottom: 10px;"></div>
                        <div class="glass-slide-wrapper">
                            <div id="glassSlide" class="glass-slide">
                                <div id="dropletGrid" class="droplet-grid"></div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <textarea id="xmlOutput" class="xml-output" readonly></textarea>
                        <div class="btn-group">
                            <button id="copyBtn" class="btn">Copy code</button>
                            <button id="downloadBtn" class="btn">Download</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Global -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle" class="modal-title">Notice</h3>
            <p id="modalMessage" class="modal-message">Message goes here.</p>
            <button class="btn" style="width: 100%;" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- Rodapé -->
    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; <span id="year"></span> Floriatan Santos Costa — All rights reserved</p>
            </div>
            <div class="footer-right">
                <a href="/en/">Perfil</a>
                <a href="/web/sobre">Sobre</a>
                <a href="/web/contato">Contato</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./js/app.js"></script>
    <script src="./components/custom-plate/app.js"></script>
</body>

</html>
