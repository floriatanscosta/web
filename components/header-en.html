<!-- components/header-en.html (INGLÊS) -->
<header>
    <div class="container header-content">
        <a href="/en/">
            <img src="/assets/logo.svg" alt="Logo Floriatan" class="logo-img">
        </a>
        <h1 class="site-title">Floriatan Santos Costa</h1>
        
        <!-- Agrupando os botões na direita -->
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
            
            <!-- Botões de Idioma -->
            <div class="lang-switcher" style="font-weight: bold; font-size: 0.95rem;">
                <button onclick="switchLanguage('pt')" style="background: none; border: none; cursor: pointer; color: inherit; padding: 0;">PT</button>
                <span>|</span>
                <button onclick="switchLanguage('en')" style="background: none; border: none; cursor: pointer; color: inherit; padding: 0;">EN</button>
            </div>

            <!-- Botão de Tema (Modo Escuro) com SVG -->
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme" style="padding: 0;">
                <img src="/assets/icons/escuro.svg" alt="Enable Dark Mode" style="width: 20px; height: 20px;">
            </button>
            
            <!-- Botão Menu Mobile -->
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>
    </div>
</header>
<nav>
    <div class="container nav-content" id="navMenu">
        <a href="/web/en/">Home</a>
        <a href="/web/en/biografia.html">Biography</a>
        <a href="/web/en/publicacoes.html">Publications</a>
        <a href="/web/en/contato.html">Contact</a>
    </div>
</nav>
