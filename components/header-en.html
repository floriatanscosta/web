<!-- components/header-en.html (INGLÊS) -->
<header>
    <div class="container header-content">
        <a href="/web/en">
            <img src="../assets/logo.svg" alt="Logo Floriatan" class="logo-img">
        </a>
        <h1 class="site-title">Floriatan Santos Costa</h1>
        
        <!-- Agrupando os botões na direita -->
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
            
            <!-- Botão Dropdown de Idioma -->
            <div class="lang-dropdown">
                <button class="lang-dropbtn">EN</button>
                <div class="lang-dropdown-content">
                    <button onclick="switchLanguage('pt')">Português (PT)</button>
                    <button onclick="switchLanguage('en')">English (EN)</button>
                </div>
            </div>
            <!-- Botão de Tema (Modo Escuro) com SVG -->
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme" style="padding: 0;">
                <img src="../assets/icons/escuro.svg" alt="Enable Dark Mode" style="width: 20px; height: 20px;">
            </button>
            
            <!-- Botão Menu Mobile -->
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>
    </div>
</header>
<nav>
    <div class="container nav-content" id="navMenu">
        <a href="/web/en">Home</a>
        <a href="/web/en/biografia">Biography</a>
        <a href="/web/en/publicacoes">Publications</a>
        <a href="/web/en/contato">Contact</a>
    </div>
</nav>
